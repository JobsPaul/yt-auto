name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: YtAuto-debug-apk
          path: app/build/outputs/apk/*/debug/*.apk
      - name: Show APK manifest
        run: |
          AAPT2=$(ls -d $ANDROID_HOME/build-tools/*/aapt2 | sort -V | tail -1)
          $AAPT2 dump badging app/build/outputs/apk/nav/debug/app-nav-debug.apk | head -20
          $AAPT2 dump xmltree --file AndroidManifest.xml app/build/outputs/apk/nav/debug/app-nav-debug.apk
